<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin{% endblock %} — SONAWEB</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<style>
  :root{
    --cream:#F5F0E7; --beige:#E9E2D6; --sand:#C9B79E;
    --brown:#6B5844; --espresso:#3B2F24; --espresso-deep:#241C15;
    --ok:#3d7a4f; --danger:#a3392f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream); color:var(--espresso-deep); display:flex; min-height:100vh;
  }
  aside.sidebar{
    width:220px; flex-shrink:0; background:var(--espresso); color:var(--cream);
    display:flex; flex-direction:column; padding:24px 0; position:sticky; top:0; height:100vh;
  }
  .sidebar .brand{ padding:0 22px 22px; }
  .sidebar .brand .name{ font-family:'Bodoni Moda',Georgia,serif; font-style:italic; font-weight:700; font-size:22px; display:block; }
  .sidebar .brand .surname{ font-family:'Jost',sans-serif; font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--sand); }
  nav.sidebar-nav{ display:flex; flex-direction:column; gap:2px; padding:0 12px; flex:1; }
  nav.sidebar-nav a{
    display:block; padding:11px 14px; border-radius:8px; color:var(--cream); text-decoration:none;
    font-size:14px; opacity:.75;
  }
  nav.sidebar-nav a:hover{ opacity:1; background:rgba(245,240,231,.08); }
  nav.sidebar-nav a.active{ opacity:1; background:rgba(245,240,231,.14); font-weight:600; }
  .sidebar-footer{ padding:0 12px; display:flex; flex-direction:column; gap:2px; }
  .sidebar-footer a, .sidebar-footer button{
    display:block; width:100%; text-align:left; padding:11px 14px; border-radius:8px;
    color:var(--cream); text-decoration:none; font:inherit; font-size:13px; opacity:.65;
    background:none; border:none; cursor:pointer;
  }
  .sidebar-footer a:hover, .sidebar-footer button:hover{ opacity:1; background:rgba(245,240,231,.08); }

  main.content{ flex:1; padding:32px 40px 80px; max-width:920px; }
  h1.page-title{ font-size:22px; margin:0 0 22px; color:var(--espresso-deep); }

  .flash{ font-size:13px; border-radius:8px; padding:10px 14px; margin-bottom:18px; }
  .flash.ok{ background:#e2efe4; color:var(--ok); }
  .flash.error{ background:#fbe4e1; color:var(--danger); }

  button, .btn{
    font:inherit; cursor:pointer; border:1px solid var(--sand);
    background:#fff; color:var(--espresso-deep);
    padding:9px 14px; border-radius:8px; text-decoration:none; display:inline-block;
  }
  button:hover, .btn:hover{ background:var(--beige); }
  .btn.primary{ background:var(--brown); color:#fff; border-color:var(--brown); font-weight:600; }
  .btn.primary:hover{ background:var(--espresso-deep); }
  .btn.danger{ color:var(--danger); border-color:var(--danger); background:#fff; }

  label{ display:block; font-size:13px; font-weight:600; color:var(--brown); margin-bottom:14px; }
  label input[type=text], label input[type=password], label input:not([type]), label textarea, label select{
    display:block; width:100%; margin-top:5px; font:inherit; font-size:14px;
    padding:9px 10px; border:1px solid var(--sand); border-radius:7px; background:#fff; color:var(--espresso-deep);
  }
  label textarea{ resize:vertical; font-family:inherit; }
  .field-row.two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .cardlist{ display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .card{ background:#fff; border:1px solid var(--sand); border-radius:12px; padding:16px; }
  .card-head{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  .card-head img{ width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--sand); flex-shrink:0; }
  .card-title{ font-weight:600; font-size:14px; flex:1; }
  .card-actions{ display:flex; gap:4px; }
  .card-actions form{ display:inline; }
  .icon-btn{ padding:6px 10px; font-size:13px; }
  details{ margin-top:10px; }
  details summary{ cursor:pointer; font-size:13px; color:var(--brown); font-weight:600; }
  details .details-body{ margin-top:14px; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="name">soňa</span>
      <span class="surname">Tománková</span>
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('admin_ponuky') }}" class="{{ 'active' if active=='ponuky' else '' }}">Moja ponuka</a>
      <a href="{{ url_for('admin_texty') }}" class="{{ 'active' if active=='texty' else '' }}">Texty stránky</a>
      <a href="{{ url_for('admin_recenzie') }}" class="{{ 'active' if active=='recenzie' else '' }}">Recenzie</a>
      <a href="{{ url_for('admin_videa') }}" class="{{ 'active' if active=='videa' else '' }}">Marketing videá</a>
      <a href="{{ url_for('admin_nastavenia') }}" class="{{ 'active' if active=='nastavenia' else '' }}">Nastavenia</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" target="_blank">Zobraziť web ↗</a>
      <form method="post" action="{{ url_for('admin_logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Odhlásiť sa</button>
      </form>
    </div>
  </aside>
  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
